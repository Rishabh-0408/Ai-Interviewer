[project]
name = "ai-interviewer-backend"
version = "0.1.0"
description = "AI Interviewer — Evidence-driven adaptive interview preparation platform"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",

    # Authentication
    "firebase-admin>=6.5.0",

    # Storage
    "boto3>=1.35.0",

    # Monitoring
    "sentry-sdk[fastapi]>=2.14.0",
    "structlog>=24.4.0",

    # LLM & AI
    "google-genai>=1.0.0",

    # Document Parsing
    "pymupdf>=1.24.0",

    # Utilities
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
