version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_interviewer_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: ai_interviewer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_interviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_interviewer_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_interviewer:${DB_PASSWORD:-localdev}@db:5432/ai_interviewer
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads

volumes:
  pgdata:
    driver: local
